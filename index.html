<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <link rel="stylesheet" href="./css/style.css" title="" type="" />
  
  <link rel="stylesheet" href="https://fonts.google.com/specimen/Outfit" title="" type="" />
  
  <title>Frontend Mentor | QR code component</title>

</head>
<body>
  
  <div class="container">
    <div class="imageContainer">
      <img src="./images/image-qr-code.png" alt="QR Code" class="qrImage" />
    </div>

    <div class="descriptionContainer">
      <div class="intro">
        <h2>Improve your front-end skills by building projects
        </h2>
      </div>
      
      <div class="descriptionTxt">
          <p>
            Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
          </p>
      </div>
    </div>
  </div>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://www.github.com/EngrMuna">Munachimso Nwosu (Engr)</a>.
  </div>
</body>
</html>
